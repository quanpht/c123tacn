<style>
  :root{--ink:#162740;--muted:#637184;--accent:#176b65;--accent2:#e6f3ef;--line:#dbe4e9;--bg:#f2f6f8;--paper:#fff;--red:#ac3b35;--green:#177153;--gold:#a46c1f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.58 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #50a8a0;outline-offset:2px}
  .top{background:#142f40;color:#fff;padding:17px max(20px,calc((100vw - 1190px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-weight:750;line-height:1.25}.brand small{display:block;color:#bdced6;font-size:13px;font-weight:500;margin-top:3px}
  .clock{font-variant-numeric:tabular-nums;font-weight:750;padding:7px 12px;border:1px solid #738e9a;border-radius:10px;white-space:nowrap}.clock.alert{color:#ffcca3;border-color:#ffcca3}
  .shell{max-width:1190px;margin:28px auto;padding:0 20px 45px;display:grid;grid-template-columns:minmax(0,1fr) 266px;gap:22px;align-items:start}
  .card,.side{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 24px #24415b0a}

  h1{font-size:clamp(25px,3vw,34px);line-height:1.18;margin:4px 0 12px}h2{font-size:23px;line-height:1.3;margin:4px 0 15px}h3{font-size:17px;margin:0 0 8px}
  p{margin:0 0 14px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .lead{font-size:17px;max-width:66ch}.meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.chip{background:#eaf1f4;padding:6px 11px;border-radius:999px;font-weight:650;font-size:14px}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;min-height:44px}.btn:hover{filter:brightness(.93)}
  .btn.secondary{background:#fff;color:var(--accent)}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.4;cursor:default}
  .bar{height:9px;border-radius:99px;background:#e8eff1;overflow:hidden;margin:13px 0 19px}.bar span{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}

  .question{padding:21px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.qhead{display:flex;gap:11px;align-items:flex-start}.qnum{min-width:37px;height:37px;border-radius:10px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-weight:800}.stem{font-weight:650;padding-top:4px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0 48px}.option{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:48px}.option:hover{border-color:#87aca9;background:#f9fcfb}.option:has(input:checked){border-color:var(--accent);background:var(--accent2)}.option input{accent-color:var(--accent);margin-top:5px}.letter{font-weight:800;color:var(--accent)}
  .numeric{margin:14px 0 0 48px;max-width:330px;width:calc(100% - 48px);padding:11px 13px;border:1px solid #aebfc7;border-radius:10px}.hint{display:block;margin:6px 0 0 48px;color:var(--muted);font-size:13px}
  .actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.actions .right{display:flex;gap:10px;flex-wrap:wrap}
  .pages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pagebtn{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:750;color:var(--ink)}.pagebtn.active{outline:2px solid var(--accent);outline-offset:1px}.pagebtn.done{background:#e5f4ee;color:#126445}.pagebtn.partial{background:#fff3da;color:#835310}
  .legend{font-size:13px;color:var(--muted);margin:14px 0 0}.sideStat{font-weight:700;margin-bottom:13px}.mobileNav{display:none}
  .resultTop{display:grid;grid-template-columns:150px 1fr;gap:23px;align-items:center;margin:17px 0 22px}.score{border:7px solid #d7ebe3;border-radius:50%;width:150px;height:150px;display:grid;place-content:center;text-align:center;color:var(--green)}.score strong{font-size:39px;line-height:1}.score span{font-weight:700}
  .review{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.review.ok{border-left:5px solid var(--green)}.review.bad{border-left:5px solid var(--red)}.review.blank{border-left:5px solid var(--gold)}.review b{color:var(--ink)}.review .label{font-weight:800;margin-bottom:7px}.review p{margin:5px 0}.review .explain{background:#f5f8f9;padding:11px;border-radius:8px;margin-top:10px}.resultNav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.resultNav a{display:inline-block;padding:5px 9px;border-radius:7px;background:#eaf1f4;color:var(--ink);text-decoration:none;font-weight:700}
  .notice{background:#fff8e8;border:1px solid #edd8a3;padding:12px 14px;border-radius:10px;margin:14px 0}.hidden{display:none!important}
  @media(max-width:830px){.shell{grid-template-columns:1fr}.side{position:static;order:-1}.mobileNav{display:inline-block}.side.collapsed .sideBody{display:none}.side.collapsed{padding:10px 16px}.options{grid-template-columns:1fr}.card{padding:21px 18px}.shell{margin:15px auto;gap:12px}.resultTop{grid-template-columns:1fr}.score{width:130px;height:130px}}
  @media(max-width:450px){.top{padding:13px 16px}.brand{font-size:14px}.brand small{font-size:11px}.clock{font-size:14px;padding:5px 8px}.options{margin-left:0}.numeric,.hint{margin-left:0;width:100%}.qhead{gap:8px}}

<script id="quiz-data" type="application/json">[{"title": "Vocabulary, grammar and symbols", "questions": [{"number": 1, "stem": "In a division of positive integers, what is the amount left over after forming the largest possible number of complete groups called?", "type": "choice", "options": ["divisor", "quotient", "remainder", "dividend"], "answer": "C", "explanation": "Remainder là số dư: phần còn lại sau khi chia thành các nhóm đầy đủ."}, {"number": 2, "stem": "Two positive integers whose highest common factor is 1 are said to be ____.", "type": "choice", "options": ["coprime", "consecutive", "composite", "equal"], "answer": "A", "explanation": "Coprime nghĩa là nguyên tố cùng nhau; hai số có ước chung lớn nhất bằng 1."}, {"number": 3, "stem": "Which term describes a real number that cannot be expressed as a ratio of two integers?", "type": "choice", "options": ["an integer", "a rational number", "a natural number", "an irrational number"], "answer": "D", "explanation": "An irrational number là số vô tỉ, không biểu diễn được dưới dạng a/b với a, b nguyên và b ≠ 0."}, {"number": 4, "stem": "In an algebraic term, what is the numerical factor multiplying a variable called?", "type": "choice", "options": ["exponent", "coefficient", "constant term", "root"], "answer": "B", "explanation": "Coefficient là hệ số nhân với biến; khác với exponent (số mũ) và constant term (hạng tử không chứa biến)."}, {"number": 5, "stem": "What is a value of the variable that makes an equation true called?", "type": "choice", "options": ["a solution", "a graph", "an interval", "a coefficient"], "answer": "A", "explanation": "A solution là nghiệm: giá trị thay vào làm cho đẳng thức đúng."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 6, "stem": "What is the set of output values actually attained by a function called?", "type": "choice", "options": ["domain", "axis", "range", "intercept"], "answer": "C", "explanation": "Range là tập giá trị đầu ra thực sự đạt được; domain là tập các đầu vào được phép."}, {"number": 7, "stem": "What is a line segment with both endpoints on a circle called?", "type": "choice", "options": ["radius", "tangent", "secant", "chord"], "answer": "D", "explanation": "Chord là dây cung. Secant là đường thẳng cắt đường tròn tại hai điểm, không phải đoạn thẳng nối hai điểm đó."}, {"number": 8, "stem": "In a triangle, what is a perpendicular segment from a vertex to the line containing the opposite side called?", "type": "choice", "options": ["median", "altitude", "diagonal", "bisector"], "answer": "B", "explanation": "Altitude là đường cao. Đường cao vuông góc với đường thẳng chứa cạnh đối diện."}, {"number": 9, "stem": "Which conic consists of points for which the sum of the distances to two distinct fixed foci is a constant greater than the distance between the foci?", "type": "choice", "options": ["ellipse", "hyperbola", "parabola", "circle"], "answer": "A", "explanation": "Ellipse là elip: tổng khoảng cách đến hai tiêu điểm cố định phân biệt là một hằng số lớn hơn khoảng cách giữa hai tiêu điểm."}, {"number": 10, "stem": "Which solid has one polygonal base and triangular side faces meeting at a single apex?", "type": "choice", "options": ["prism", "cylinder", "pyramid", "sphere"], "answer": "C", "explanation": "Pyramid là khối chóp: một đáy đa giác và các mặt bên tam giác cùng gặp tại đỉnh."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 11, "stem": "How is 4 ∣ 52 read in a statement about integers?", "type": "choice", "options": ["Four is less than fifty-two.", "Four divides fifty-two.", "Four does not divide fifty-two.", "Four divided by fifty-two."], "answer": "B", "explanation": "Trong quan hệ chia hết, dấu | đọc là divides: 4 là một ước của 52."}, {"number": 12, "stem": "How is √49 read?", "type": "choice", "options": ["Forty-nine squared.", "Forty-nine divided by two.", "The square of forty-nine.", "The square root of forty-nine."], "answer": "D", "explanation": "√49 đọc là the square root of forty-nine. Square là bình phương, còn square root là căn bậc hai."}, {"number": 13, "stem": "Which reading correctly describes −1 ≤ x < 6?", "type": "choice", "options": ["x is at least negative one and less than six.", "x is greater than negative one and at most six.", "x is at most negative one and greater than six.", "x is less than negative one and at least six."], "answer": "A", "explanation": "At least bao gồm dấu bằng ở −1; less than loại giá trị 6."}, {"number": 14, "stem": "How is f(3) = 8 read?", "type": "choice", "options": ["f times three equals eight.", "f minus three equals eight.", "f of three equals eight.", "f divided by three equals eight."], "answer": "C", "explanation": "f(3) đọc là f of three, tức giá trị của hàm f tại đầu vào 3."}, {"number": 15, "stem": "How is AB ⟂ CD read?", "type": "choice", "options": ["AB is parallel to CD.", "AB is perpendicular to CD.", "AB is congruent to CD.", "AB is a diameter of CD."], "answer": "B", "explanation": "Dấu ⟂ biểu thị vuông góc: is perpendicular to."}]}, {"title": "Vocabulary, grammar and symbols", "questions": [{"number": 16, "stem": "Complete the sentence: “The product ____ two negative numbers is positive.”", "type": "choice", "options": ["of", "to", "by", "at"], "answer": "A", "explanation": "Cụm đúng là the product of two numbers: tích của hai số."}, {"number": 17, "stem": "Complete the sentence: “Solve the equation ____ x.”", "type": "choice", "options": ["from", "with", "on", "for"], "answer": "D", "explanation": "Solve for x nghĩa là giải phương trình để tìm x."}, {"number": 18, "stem": "Complete the sentence: “The values of y are ____ by the rule y = 5x − 2.”", "type": "choice", "options": ["determine", "determining", "determined", "determination"], "answer": "C", "explanation": "Câu bị động dùng are determined by: được xác định bởi."}, {"number": 19, "stem": "Complete the sentence: “The diagonal divides the rectangle ____ two triangles.”", "type": "choice", "options": ["by", "into", "of", "from"], "answer": "B", "explanation": "Divide something into parts: chia một đối tượng thành các phần."}, {"number": 20, "stem": "Complete the sentence: “A cube is a three-____ figure.”", "type": "choice", "options": ["dimensional", "dimension", "dimensions", "dimensionally"], "answer": "A", "explanation": "Three-dimensional là tính từ bổ nghĩa cho figure: hình ba chiều."}]}, {"title": "Guided cloze test", "questions": [{"number": 21, "stem": "Blank 21", "type": "choice", "options": ["product", "difference", "sum", "ratio"], "answer": "D", "explanation": "Ratio of two integers là tỉ số của hai số nguyên."}, {"number": 22, "stem": "Blank 22", "type": "choice", "options": ["numerator", "denominator", "remainder", "exponent"], "answer": "B", "explanation": "Mẫu số (denominator) phải khác 0; tử số có thể bằng 0."}, {"number": 23, "stem": "Blank 23", "type": "choice", "options": ["independent", "constant", "dependent", "equal"], "answer": "C", "explanation": "Đầu ra là dependent variable (biến phụ thuộc), vì được xác định từ đầu vào theo quy tắc của hàm."}, {"number": 24, "stem": "Blank 24", "type": "choice", "options": ["radius", "diameter", "arc", "chord"], "answer": "A", "explanation": "Khoảng cách từ tâm đến một điểm trên đường tròn là bán kính (radius)."}, {"number": 25, "stem": "Blank 25", "type": "choice", "options": ["area", "volume", "surface", "circumference"], "answer": "D", "explanation": "Length around the circle chỉ chu vi đường tròn, tức circumference."}], "passage": "Mathematical descriptions connect numbers, rules and shapes. A rational number can be written as a (21) ____ of two integers, provided that the (22) ____ is not zero. A function assigns exactly one output to each permitted input; the output is the (23) ____ variable. In geometry, the distance from the centre of a circle to a point on it is its (24) ____. The length around the circle is its (25) ____. When solving a problem, first identify the quantity requested and distinguish a length from an area or a volume."}, {"title": "Mathematical language and problems", "questions": [{"number": 26, "stem": "A number is nine less than twice seventeen. What is the number?", "type": "choice", "options": ["8", "25", "26", "43"], "answer": "B", "explanation": "Nine less than twice seventeen nghĩa là 2 × 17 − 9 = 25. Less than yêu cầu đảo thứ tự so với cách đọc từng từ."}, {"number": 27, "stem": "Ninety-four stickers are placed in full packs of eight. How many stickers are left over?", "type": "choice", "options": ["2", "4", "6", "7"], "answer": "C", "explanation": "94 = 8 × 11 + 6, nên còn 6 nhãn. Left over hỏi số dư, không hỏi số gói."}, {"number": 28, "stem": "Two bells ring at intervals of 14 minutes and 21 minutes. They ring together now. After how many minutes will they next ring together?", "type": "choice", "options": ["7", "28", "35", "42"], "answer": "D", "explanation": "Next ring together yêu cầu thời điểm chung dương nhỏ nhất: LCM(14, 21) = 42 phút."}, {"number": 29, "stem": "Thirty-five per cent of a collection of 80 books are reference books. How many reference books are there?", "type": "choice", "options": ["28", "35", "45", "52"], "answer": "A", "explanation": "Thirty-five per cent of nghĩa là 35/100 × 80 = 28."}, {"number": 30, "stem": "A complex number has real part −6 and imaginary part 2. Which is its complex conjugate?", "type": "choice", "options": ["6 + 2i", "−6 − 2i", "6 − 2i", "−2 + 6i"], "answer": "B", "explanation": "Số ban đầu là −6 + 2i. Liên hợp giữ phần thực và đổi dấu phần ảo: −6 − 2i."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 31, "stem": "The sum of two numbers is 44. The larger is eight more than the smaller. What is the larger number?", "type": "choice", "options": ["18", "22", "26", "36"], "answer": "C", "explanation": "Gọi số lớn L, số nhỏ S: L + S = 44, L − S = 8. Cộng hai đẳng thức: 2L = 52, nên L = 26."}, {"number": 32, "stem": "Which number is greater than −4 and at most −1?", "type": "choice", "options": ["−5", "−4", "0", "−1"], "answer": "D", "explanation": "Điều kiện là −4 < x ≤ −1. Chỉ −1 thỏa cả hai điều kiện; −4 bị loại bởi greater than."}, {"number": 33, "stem": "A taxi fare consists of a fixed charge of $7 plus $2.50 for each kilometre travelled. What is the fare for a six-kilometre journey, in dollars?", "type": "choice", "options": ["15", "22", "42", "57"], "answer": "B", "explanation": "Fixed charge trả một lần: 7 + 2.50 × 6 = 22 đô la."}, {"number": 34, "stem": "For the function f(x) = −2x + 5, what is the output when the input is −3?", "type": "choice", "options": ["11", "−11", "1", "−1"], "answer": "A", "explanation": "Input là giá trị x. f(−3) = −2 × (−3) + 5 = 11; tích của hai số âm là số dương."}, {"number": 35, "stem": "The graph of y = x² is shifted two units to the right and one unit upwards. What are the coordinates of the new vertex?", "type": "choice", "options": ["(−2, 1)", "(2, −1)", "(2, 1)", "(1, 2)"], "answer": "C", "explanation": "Đỉnh ban đầu (0, 0) chuyển sang (2, 1): right tăng hoành độ, upwards tăng tung độ."}]}, {"title": "Mathematical language and problems", "questions": [{"number": 36, "stem": "An exterior angle of a triangle measures 125°. One of the two remote interior angles measures 48°. What is the other remote interior angle?", "type": "choice", "options": ["48°", "55°", "173°", "77°"], "answer": "D", "explanation": "Góc ngoài bằng tổng hai góc trong không kề nó: góc còn lại = 125° − 48° = 77°."}, {"number": 37, "stem": "An inscribed angle measures 46°. What is the central angle subtending the same arc?", "type": "choice", "options": ["23°", "46°", "92°", "134°"], "answer": "C", "explanation": "Central angle (góc ở tâm) bằng hai lần inscribed angle (góc nội tiếp) chắn cùng cung: 2 × 46° = 92°."}, {"number": 38, "stem": "A regular octagon has a perimeter of 64 cm. What is the length of each side, in centimetres?", "type": "choice", "options": ["8", "6", "16", "56"], "answer": "A", "explanation": "Octagon có 8 cạnh; regular cho biết các cạnh bằng nhau. Mỗi cạnh dài 64/8 = 8 cm."}, {"number": 39, "stem": "A right circular cone has radius 2 cm and perpendicular height 9 cm. What is its volume, in cubic centimetres? Choose the exact expression.", "type": "choice", "options": ["18π", "36π", "6π", "12π"], "answer": "D", "explanation": "V = (1/3)πr²h = (1/3) × π × 2² × 9 = 12π cm³. Perpendicular height là chiều cao, không phải đường sinh."}, {"number": 40, "stem": "A right circular cylinder is cut by a plane parallel to its bases and between them. What is the shape of the cross-section?", "type": "choice", "options": ["rectangle", "circle", "triangle", "parabola"], "answer": "B", "explanation": "Mặt phẳng song song và nằm giữa hai đáy cắt khối trụ theo một hình tròn (circle)."}]}, {"title": "Short answers", "questions": [{"number": 41, "stem": "The temperature is five degrees below zero. It rises by eight degrees and then falls by six degrees. What is the final temperature? Write the numerical value only.", "type": "number", "answer": "−3", "explanation": "Below zero cho giá trị ban đầu −5. Rises by là cộng, falls by là trừ: −5 + 8 − 6 = −3."}, {"number": 42, "stem": "Fifty-four red counters and 90 blue counters are divided into the greatest possible number of identical packs, with none left over. How many counters in total are in each pack?", "type": "number", "answer": "8", "explanation": "Số gói lớn nhất là HCF(54, 90) = 18. Mỗi gói có 54/18 = 3 quân đỏ và 90/18 = 5 quân xanh, tổng 8 quân. Câu hỏi yêu cầu số quân mỗi gói, không phải số gói."}, {"number": 43, "stem": "A tank has a capacity of 150 litres and is three fifths full. One third of the water currently in the tank is removed. How many litres of water remain?", "type": "number", "answer": "60", "explanation": "Nước ban đầu: (3/5) × 150 = 90 lít. Lấy đi một phần ba lượng nước hiện có, nên còn (2/3) × 90 = 60 lít. Không lấy một phần ba dung tích bể."}, {"number": 44, "stem": "Nine less than twice a number equals fourteen more than the number. What is the number?", "type": "number", "answer": "23", "explanation": "Đọc câu thành 2x − 9 = x + 14, nên x = 23. Thử lại: 46 − 9 = 23 + 14 = 37."}, {"number": 45, "stem": "The function f(x) = 3x + 2 gives an output of 20. For the same input, what is the output of g(x) = x² − 5?", "type": "number", "answer": "31", "explanation": "Tìm đầu vào từ 3x + 2 = 20: x = 6. Same input yêu cầu dùng lại x = 6: g(6) = 36 − 5 = 31."}]}, {"title": "Short answers", "questions": [{"number": 46, "stem": "The graph of y = x² is shifted four units to the right and seven units downwards. What is the y-intercept of the new graph? Write its numerical value only.", "type": "number", "answer": "9", "explanation": "Quy tắc mới là y = (x − 4)² − 7. Y-intercept là tung độ khi x = 0: 16 − 7 = 9; không phải tung độ đỉnh −7."}, {"number": 47, "stem": "An isosceles triangle has a perimeter of 38 cm and a base of 14 cm. What is the length of each of its two equal sides, in centimetres?", "type": "number", "answer": "12", "explanation": "Hai cạnh bằng nhau có tổng 38 − 14 = 24 cm, nên mỗi cạnh dài 12 cm. Bộ cạnh 12, 12, 14 thỏa bất đẳng thức tam giác."}, {"number": 48, "stem": "A semicircular garden has radius 8 m. A fence follows its entire boundary, including the straight edge. What is the total length of the fence, in metres? Round to one decimal place.", "type": "number", "answer": "41.1", "explanation": "Entire boundary, including the straight edge yêu cầu cộng cung nửa đường tròn và đường kính: 8π + 16 ≈ 41.1327, làm tròn được 41.1 m.", "oneDecimal": true}, {"number": 49, "stem": "Two concentric circles have diameters 20 cm and 12 cm. What is the area of the ring between them, in square centimetres? Round to one decimal place.", "type": "number", "answer": "201.1", "explanation": "Bán kính lần lượt là 10 và 6 cm. Diện tích vành khăn: π × (10² − 6²) = 64π ≈ 201.0619, làm tròn được 201.1 cm². Không dùng đường kính thay bán kính.", "oneDecimal": true}, {"number": 50, "stem": "A cylinder has diameter 6 cm and height 8 cm. A cone has the same circular base and the same perpendicular height. How much greater is the cylinder’s volume than the cone’s volume, in cubic centimetres? Round to one decimal place.", "type": "number", "answer": "150.8", "explanation": "Bán kính là 3 cm. Thể tích trụ 72π; thể tích nón 24π. How much greater hỏi hiệu: 72π − 24π = 48π ≈ 150.7964, làm tròn được 150.8 cm³.", "oneDecimal": true}]}]</script>
<script>
(() => {
  'use strict';
  const groups=JSON.parse(document.getElementById('quiz-data').textContent), all=groups.flatMap(g=>g.questions);
  const KEY='combined-ch123-review-20261007-v1', DURATION=60*60*1000;
  const main=document.getElementById('main'),side=document.getElementById('side'),clock=document.getElementById('clock');
  let state=read(),tick=null;
  function fresh(){return {status:'intro',page:0,answers:{},startedAt:null,submittedAt:null}}
  function read(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&['intro','working','submitted'].includes(v.status)?v:fresh()}catch{return fresh()}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function numFilled(v){return v!==undefined&&String(v).trim()!==''}
  function answered(q){return numFilled(state.answers[q.number])}
  function count(){return all.filter(answered).length}
  function timeLeft(){return Math.max(0,DURATION-(Date.now()-state.startedAt))}
  function clockUpdate(){if(state.status!=='working')return;const left=timeLeft();clock.textContent=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;clock.classList.toggle('alert',left<300000);if(left===0)submit(true)}
  function go(page){state.page=Math.max(0,Math.min(groups.length-1,page));save();render();window.scrollTo({top:0,behavior:'instant'})}
  function intro(){side.classList.add('hidden');clock.classList.add('hidden');main.innerHTML=`<div class="eyebrow">Practice test</div><h1>Combined review · Chapters 1, 2 and 3</h1><p class="lead">A 50-question review of arithmetic, algebra and geometry through mathematical English: vocabulary, symbols, a five-blank passage, word problems and short answers.</p><div class="meta"><span class="chip">50 questions</span><span class="chip">10 pages · 5 questions each</span><span class="chip">60 minutes</span><span class="chip">10 points</span></div><p>Questions 1–40: choose A–D. Questions 41–50: enter a numerical answer. For Questions 48–50, round to one decimal place and use a decimal point. Each correct answer earns 0.2 point.</p><p class="muted">Scope: Chapters 1–2, Units 1–2; Chapter 3, Units 1–3. A basic calculator may be used.</p><p class="notice">Your work is saved on this browser while you practise. The answer key and explanations appear after submission.</p><button class="btn" id="start">Start the test</button>`;document.getElementById('start').onclick=()=>{state={...fresh(),status:'working',startedAt:Date.now()};save();render()}}
  function sidePanel(){side.classList.remove('hidden');side.classList.add('collapsed');const n=count();side.innerHTML=`<button id="toggleNav" class="btn secondary mobileNav" type="button">Pages and progress ▾</button><div class="sideBody"><h3>Question navigator</h3><div class="sideStat">${n} / 50 answered</div><div class="pages">${groups.map((g,i)=>{const done=g.questions.filter(answered).length;return `<button type="button" class="pagebtn ${i===state.page?'active':''} ${done===5?'done':done?'partial':''}" data-page="${i}" aria-label="Page ${i+1}, ${done} of 5 answered">${i+1}</button>`}).join('')}</div><p class="legend">Green: all answered · Yellow: partially answered</p></div>`;side.querySelector('#toggleNav').onclick=()=>side.classList.toggle('collapsed');side.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page))}
  function working(){clock.classList.remove('hidden');clockUpdate();sidePanel();const group=groups[state.page],first=group.questions[0].number;
    main.innerHTML=`<div class="eyebrow">Page ${state.page+1} of 10 · Questions ${first}–${first+4}</div><h2>${esc(group.title)}</h2><p class="muted">Answer each question, then move to another page. You can return before submitting.</p><div class="bar"><span style="width:${count()*2}%"></span></div>${group.passage?`<div class="passage"><strong>Read the passage and complete blanks 21–25.</strong><br>${esc(group.passage)}</div>`:''}${group.questions.map(q=>`<article class="question"><div class="qhead"><div class="qnum">${q.number}</div><div class="stem">${esc(q.stem)}</div></div>${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="q${q.number}" value="${'ABCD'[i]}" ${state.answers[q.number]==='ABCD'[i]?'checked':''}><span class="letter">${'ABCD'[i]}.</span><span>${esc(o)}</span></label>`).join('')}</div>`:`<input class="numeric" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-number="${q.number}" value="${esc(state.answers[q.number]??'')}" placeholder="Enter your answer" aria-label="Answer for question ${q.number}"><small class="hint">${q.oneDecimal?'Round to one decimal place. Use a decimal point, for example 12.3.':'Enter the numerical value only; do not include units.'}</small>`}</article>`).join('')}<div class="actions"><button class="btn ghost" id="prev" ${state.page===0?'disabled':''}>← Previous page</button><div class="right"><button class="btn secondary" id="next" ${state.page===9?'disabled':''}>Next page →</button><button class="btn" id="submit">Submit test</button></div></div>`;
    main.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{state.answers[+e.target.name.slice(1)]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelectorAll('[data-number]').forEach(el=>el.addEventListener('input',e=>{state.answers[+e.target.dataset.number]=e.target.value;save();sidePanel();main.querySelector('.bar span').style.width=count()*2+'%'}));
    main.querySelector('#prev').onclick=()=>go(state.page-1);main.querySelector('#next').onclick=()=>go(state.page+1);main.querySelector('#submit').onclick=()=>submit(false);
  }
  function parseNumber(v){let s=String(v??'').trim().replace(/[−–]/g,'-').replace(',','.').replace(/\s+/g,'');if(!s)return null;
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return null;return {value:Number(s),fraction:false}}
  function correct(q){const response=state.answers[q.number];if(!numFilled(response))return false;if(q.type==='choice')return response===q.answer;
    if(q.oneDecimal&&!/^[+-]?\d+\.\d$/.test(String(response).replace(/[−–]/g,'-').replace(/\s+/g,'')))return false;
    const got=parseNumber(response),expected=parseNumber(q.answer);if(!got||!expected)return false;
    return Math.abs(got.value-expected.value)<1e-10}
  function submit(auto){if(state.status!=='working')return;
    const blank=50-count();if(!auto&&blank&&!confirm(`You have ${blank} unanswered question${blank===1?'':'s'}. Submit the test now?`))return;
    if(!auto&&!blank&&!confirm('Submit your answers and view the results?'))return;
    state.status='submitted';state.submittedAt=Date.now();save();render();window.scrollTo({top:0,behavior:'instant'})}
  function results(){clock.classList.add('hidden');side.classList.add('hidden');const right=all.filter(correct).length,blank=50-count();main.innerHTML=`<div class="eyebrow">Practice result</div><h1>Combined review · Chapters 1, 2 and 3</h1><div class="resultTop"><div class="score"><strong>${(right*.2).toFixed(1)}</strong><span>/ 10 points</span></div><div><h2>${right} correct · ${50-right-blank} incorrect · ${blank} blank</h2><p class="muted">Review your answers and the explanations below. Each question is worth 0.2 point.</p><button class="btn secondary" id="restart">Try again</button></div></div><h2>Answer review</h2><div class="resultNav">${groups.map((g,i)=>`<a href="#review-${i*5+1}">${i*5+1}–${i*5+5}</a>`).join('')}</div>${groups.map(g=>`${g.passage?`<div class="passage"><strong>Questions 21–25: shared passage</strong><br>${esc(g.passage)}</div>`:''}${g.questions.map(q=>{const raw=state.answers[q.number],filled=answered(q),ok=correct(q),response=q.type==='choice'&&filled?`${esc(raw)}. ${esc(q.options['ABCD'.indexOf(raw)]??'')}`:esc(filled?raw:'No answer');const key=q.type==='choice'?`${q.answer}. ${esc(q.options['ABCD'.indexOf(q.answer)])}`:esc(q.answer);return `<article class="review ${!filled?'blank':ok?'ok':'bad'}" id="review-${q.number}"><div class="label">Question ${q.number} · ${!filled?'Blank':ok?'Correct':'Incorrect'}</div><p><b>${esc(q.stem)}</b></p><p>Your answer: ${response}</p><p>Correct answer: <strong>${key}</strong></p><p class="explain">${esc(q.explanation)}</p></article>`}).join('')}`).join('')}<div class="actions"><button class="btn secondary" id="restartBottom">Try again</button><a class="btn ghost" href="#main">Back to top ↑</a></div>`;
    const restart=()=>{if(!confirm('Start a new attempt? Your current answers will be cleared on this browser.'))return;state=fresh();save();render();window.scrollTo({top:0,behavior:'instant'})};main.querySelector('#restart').onclick=restart;main.querySelector('#restartBottom').onclick=restart;
  }
  function render(){if(state.status==='working'&&timeLeft()===0){submit(true);return}if(state.status==='intro')intro();else if(state.status==='working')working();else results()}
  render();tick=setInterval(clockUpdate,1000);
})();
</script>
</body>
</html>
